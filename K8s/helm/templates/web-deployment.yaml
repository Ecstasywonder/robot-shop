apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    service: web
spec:
  replicas: 1
  selector:
    matchLabels:
      service: web
  template:
    metadata:
      labels:
        service: web
      annotations:
        checksum/web-access: {{ .Files.Get "files/web-default.conf.template" | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      volumes:
        - name: web-access-template
          configMap:
            name: web-access-logging
      containers:
      - name: web
        image: {{ .Values.images.web }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        volumeMounts:
          - name: web-access-template
            mountPath: /etc/nginx/conf.d/default.conf.template
            subPath: default.conf.template
            readOnly: true
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 200m
            memory: 100Mi
          requests:
            cpu: 100m
            memory: 50Mi
      restartPolicy: Always
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
