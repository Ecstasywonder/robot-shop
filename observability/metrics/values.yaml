# Initial, single-node baseline for prometheus-community/kube-prometheus-stack 92.7.0.
# Keep this release private: every user-facing service remains ClusterIP and ingress is off.

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false

# The node exporter needs host namespaces and host mounts, which conflict with
# the initial restricted-warning posture. Enable only after a separate review.
nodeExporter:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 256Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        cpu: 50m
        memory: 256Mi
  service:
    type: ClusterIP
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 128Mi

prometheus:
  service:
    type: ClusterIP
  ingress:
    enabled: false
  prometheusSpec:
    replicas: 1
    retention: 3d
    retentionSize: 4GB
    enforcedSampleLimit: 50000
    enforcedTargetLimit: 100
    enforcedLabelLimit: 40
    enforcedBodySizeLimit: 16MB
    resources:
      requests:
        cpu: 150m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: local-path
          resources:
            requests:
              storage: 8Gi
    # Preserve chart/release selectors, then constrain monitor CR namespaces
    # to observability and Robot Shop. Trusted monitors may target elsewhere.
    serviceMonitorSelectorNilUsesHelmValues: true
    serviceMonitorNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - observability
            - robot-shop
    podMonitorSelectorNilUsesHelmValues: true
    podMonitorNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - observability
            - robot-shop
    probeSelectorNilUsesHelmValues: true
    probeNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - observability
            - robot-shop
    ruleSelectorNilUsesHelmValues: true
    ruleNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - observability
            - robot-shop

alertmanager:
  service:
    type: ClusterIP
  ingress:
    enabled: false
  alertmanagerSpec:
    replicas: 1
    # The operator mounts this same-namespace Secret at
    # /etc/alertmanager/secrets/slack-webhook/url. Its value is never Helm input.
    secrets:
      - slack-webhook
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 192Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: local-path
          resources:
            requests:
              storage: 1Gi
  # Keep the 92.7.0 defaults verbatim and add one narrowly labelled route.
  # Do not replace api_url_file with an inline URL or a Secret value reference.
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
        equal:
          - namespace
      - target_matchers:
          - alertname = InfoInhibitor
    receivers:
      - name: "null"
      - name: slack-tscapstone
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook/url
            channel: "#tscapstone"
            send_resolved: true
            title: '{{ if eq (index .CommonLabels "alertname") "CapstoneSlackDeliveryTest" }}CONNECTIVITY TEST (not an incident): {{ .Status }}{{ else }}Robot Shop capstone: {{ .Status }}{{ end }}'
            text: "alert={{ .CommonLabels.alertname }} service={{ .CommonLabels.service }} severity={{ .CommonLabels.severity }}\nRunbook: https://github.com/Ecstasywonder/robot-shop/blob/master/docs/runbook.md"
    route:
      group_by:
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "null"
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
        - matchers:
            - capstone = "robot-shop"
          receiver: slack-tscapstone
          group_by:
            - namespace
            - alertname
          continue: false
    templates:
      - /etc/alertmanager/config/*.tmpl

grafana:
  initChownData:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
  service:
    type: ClusterIP
  ingress:
    enabled: false
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    auth.anonymous:
      enabled: false
    users:
      allow_sign_up: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi
  persistence:
    enabled: true
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  rbac:
    namespaced: true
  sidecar:
    dashboards:
      searchNamespace: observability
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        cpu: 50m
        memory: 256Mi
  testFramework:
    enabled: false

kube-state-metrics:
  service:
    type: ClusterIP
  collectorsExclude:
    - secrets
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 192Mi
