apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fluent-bit
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - log-collection
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
      app.kubernetes.io/instance: fluent-bit
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      honorLabels: true
    - port: http
      path: /api/v1/metrics/prometheus
      interval: 30s
