apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fluent-bit-read-pods
  namespace: robot-shop
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fluent-bit-read-pods
  namespace: robot-shop
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: log-collection
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fluent-bit-read-pods
