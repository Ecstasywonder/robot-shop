apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - tracing-workloads.yaml
  - networkpolicies.yaml
configMapGenerator:
  - name: otel-collector-config
    namespace: observability
    files:
      - collector.yaml=collector-config.yaml
  - name: jaeger-config
    namespace: observability
    files:
      - jaeger.yaml=jaeger-config.yaml
